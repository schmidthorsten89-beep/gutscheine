<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Namensgenerator</title>
<style>
  :root {
    --bg: #14110d;
    --panel: #221c14;
    --panel-2: #2c241a;
    --border: #5a4426;
    --gold: #e8c46a;
    --gold-dim: #b8954a;
    --text: #efe6d2;
    --muted: #a99b80;
    --alliance: #4a7fd6;
    --horde: #c8382f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #2a2116 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    text-align: center; color: var(--gold); letter-spacing: .04em;
    font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 8px 0 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  label { display: block; font-size: .85rem; color: var(--gold-dim); margin-bottom: 4px; }
  select, input[type=text] {
    width: 100%; padding: 9px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font: inherit;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; padding: 10px 18px;
    border: 1px solid var(--gold-dim); background: linear-gradient(#5b4220, #3a2a14);
    color: var(--gold); font-weight: bold; letter-spacing: .03em;
  }
  button:hover { filter: brightness(1.2); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--border); font-weight: normal; }
  .check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: .9rem; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .name {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .name span { font-size: 1.15rem; color: var(--text); word-break: break-all; }
  .name .acts { display: flex; gap: 4px; flex-shrink: 0; }
  .name button { padding: 4px 8px; font-size: .9rem; font-weight: normal; }
  .name.fav { border-color: var(--gold); }
  h2 { color: var(--gold); font-size: 1.1rem; margin: 0 0 12px; }
  .faction-a { color: var(--alliance); }
  .faction-h { color: var(--horde); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .empty { color: var(--muted); font-style: italic; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #1a1408; padding: 8px 16px; border-radius: 20px;
    opacity: 0; transition: opacity .25s; pointer-events: none; font-weight: bold;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔ WoW Namensgenerator ⚔</h1>
  <p class="sub">Finde den passenden Namen für deinen nächsten Helden</p>

  <div class="panel">
    <div class="grid">
      <div>
        <label for="race">Volk</label>
        <select id="race"></select>
      </div>
      <div>
        <label for="gender">Geschlecht</label>
        <select id="gender">
          <option value="m">Männlich</option>
          <option value="f">Weiblich</option>
        </select>
      </div>
      <div>
        <label for="cls">Klasse</label>
        <select id="cls"></select>
      </div>
      <div>
        <label for="style">Stil</label>
        <select id="style">
          <option value="normal">Klassisch</option>
          <option value="dark">Düster</option>
          <option value="short">Kurz &amp; knackig</option>
          <option value="fun">Witzig / Wortspiel</option>
        </select>
      </div>
      <div>
        <label for="start">Beginnt mit (optional)</label>
        <input id="start" type="text" maxlength="4" placeholder="z. B. Ka">
      </div>
    </div>
    <div class="row">
      <button id="gen">Namen generieren</button>
      <label class="check"><input type="checkbox" id="accent"> Akzente erlauben (á, ë, ô …)</label>
    </div>
    <p class="hint">Alle Namen halten die WoW-Regeln ein: 2–12 Buchstaben, keine 3 gleichen Buchstaben hintereinander. Klicke auf einen Namen zum Kopieren.</p>
  </div>

  <div class="panel">
    <h2 id="resTitle">Vorschläge</h2>
    <div class="names" id="results"></div>
  </div>

  <div class="panel">
    <div class="row" style="margin-top:0; justify-content:space-between;">
      <h2 style="margin:0;">★ Favoriten</h2>
      <button class="ghost" id="clearFav">Alle löschen</button>
    </div>
    <div class="names" id="favs" style="margin-top:12px;"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const ACCENTS = { a:"á", e:"ë", i:"ï", o:"ô", u:"ú" };
const $ = s => document.querySelector(s);
const rnd = a => a[Math.floor(Math.random() * a.length)];

const sel = $("#race");
const groups = { A: "Allianz", H: "Horde", N: "Neutral" };
for (const [g, label] of Object.entries(groups)) {
  const og = document.createElement("optgroup"); og.label = label;
  for (const [k, r] of Object.entries(RACES)) if (r.fac === g) og.append(new Option(r.name, k));
  sel.append(og);
}
sel.append(new Option("Zufälliges Volk", "random"));

const clsSel = $("#cls");
clsSel.append(new Option("Beliebige Klasse", ""));
for (const [k, c] of Object.entries(CLASSES)) clsSel.append(new Option(c.name, k));

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

function valid(n) {
  if (n.length < 2 || n.length > 12) return false;
  if (/(.)\1\1/i.test(n)) return false;
  if (/''/.test(n) || /'$/.test(n)) return false;
  return true;
}

function addAccent(n) {
  const idx = [...n].map((c, i) => ACCENTS[c] ? i : -1).filter(i => i > 0);
  if (!idx.length) return n;
  const i = rnd(idx);
  return n.slice(0, i) + ACCENTS[n[i]] + n.slice(i + 1);
}

function makeName(raceKey, g, style, clsKey) {
  const parts = RACES[raceKey][g];
  const c = clsKey ? CLASSES[clsKey] : null;
  const x = Math.random();
  if (style === "fun") return c && x < .65 ? rnd(c.fun[g]) : rnd(FUN[g]);
  if (style === "dark") {
    const a = x < .4 ? rnd(DARK.pre) : (c && x < .7) ? rnd(c.pre) : rnd(parts.pre);
    return cap(a + (c && Math.random() < .5 ? rnd(c.suf) : rnd(DARK.suf)));
  }
  if (style === "short") {
    const a = c && x < .4 ? rnd(c.pre) : rnd(parts.pre);
    return cap(a + rnd(parts.suf).slice(0, 3));
  }
  if (c) {
    // Volk + Klasse mischen
    if (x < .45) return cap(rnd(parts.pre) + rnd(c.suf));
    if (x < .7) return cap(rnd(c.pre) + rnd(parts.mid) + rnd(parts.suf));
  }
  return cap(rnd(parts.pre) + rnd(parts.mid) + rnd(parts.suf));
}

function generate(count = 18) {
  let race = sel.value;
  const g = $("#gender").value, style = $("#style").value, cls = clsSel.value;
  const start = $("#start").value.trim().toLowerCase();
  const accent = $("#accent").checked;
  const out = new Set();
  let tries = 0;
  while (out.size < count && tries < 6000) {
    tries++;
    const rk = race === "random" ? rnd(Object.keys(RACES)) : race;
    let n = makeName(rk, g, style, cls);
    if (start) {
      if (style === "fun") { if (!n.toLowerCase().startsWith(start)) continue; }
      else if (!n.toLowerCase().startsWith(start)) {
        if (tries < 4000) continue;
        n = cap(start + rnd(RACES[rk][g].suf));
      }
    }
    if (accent && style !== "fun" && Math.random() < .5) n = addAccent(n);
    if (valid(n)) out.add(n);
  }
  const r = race === "random" ? null : RACES[race];
  const c = cls ? CLASSES[cls] : null;
  $("#resTitle").innerHTML = (r
    ? `Vorschläge – ${r.name}`
    : "Vorschläge – Zufälliges Volk")
    + (c ? ` <span style="color:${c.color}">${c.name}</span>` : "")
    + (r ? ` <span class="${r.fac === "H" ? "faction-h" : r.fac === "A" ? "faction-a" : ""}">(${groups[r.fac]})</span>` : "");
  render($("#results"), [...out], "Keine passenden Namen gefunden – probiere einen anderen Anfang.");
}

// Favoriten
let favs = [];
try { favs = JSON.parse(localStorage.getItem("wowFavs") || "[]"); } catch (e) {}
function saveFavs() { try { localStorage.setItem("wowFavs", JSON.stringify(favs)); } catch (e) {} }

function render(el, list, emptyText) {
  el.innerHTML = "";
  if (!list.length) { el.innerHTML = `<p class="empty">${emptyText}</p>`; return; }
  for (const n of list) {
    const d = document.createElement("div");
    d.className = "name" + (favs.includes(n) ? " fav" : "");
    const s = document.createElement("span"); s.textContent = n; s.style.cursor = "pointer"; s.title = "Kopieren";
    s.onclick = () => copy(n);
    const acts = document.createElement("div"); acts.className = "acts";
    const fb = document.createElement("button");
    fb.textContent = favs.includes(n) ? "★" : "☆"; fb.title = "Favorit";
    fb.onclick = () => toggleFav(n);
    acts.append(fb); d.append(s, acts); el.append(d);
  }
}

function toggleFav(n) {
  favs = favs.includes(n) ? favs.filter(x => x !== n) : [...favs, n];
  saveFavs(); renderFavs();
  document.querySelectorAll("#results .name").forEach(d => {
    const name = d.querySelector("span").textContent;
    d.classList.toggle("fav", favs.includes(name));
    d.querySelector("button").textContent = favs.includes(name) ? "★" : "☆";
  });
}
function renderFavs() { render($("#favs"), favs, "Noch keine Favoriten – klicke auf ☆ bei einem Namen."); }

function copy(n) {
  const done = () => toast(`„${n}" kopiert`);
  if (navigator.clipboard) navigator.clipboard.writeText(n).then(done, () => toast(n));
  else toast(n);
}
let tt;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600);
}

$("#gen").onclick = () => generate();
$("#clearFav").onclick = () => { if (confirm("Alle Favoriten löschen?")) { favs = []; saveFavs(); renderFavs(); } };
["#race", "#gender", "#cls", "#style"].forEach(s => $(s).addEventListener("change", () => generate()));
$("#start").addEventListener("keydown", e => { if (e.key === "Enter") generate(); });

renderFavs();
generate();
</script>
</body>
</html>
